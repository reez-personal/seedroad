<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Seedroad</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #07080f; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

    /* ── Splash / overlay ───────────────────────────────────────────────────── */
    #overlay {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 60%, #0d1a2e 0%, #07080f 70%);
    }
    #overlay h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900; letter-spacing: 0.12em; color: #fff;
      text-shadow: 0 0 60px #3af, 0 2px 4px #000;
      margin-bottom: 0.15em;
    }
    #overlay .sub {
      font-size: clamp(0.75rem, 2vw, 1rem); color: #6af;
      letter-spacing: 0.25em; text-transform: uppercase;
      margin-bottom: 2.5rem;
    }
    .controls {
      display: flex; flex-wrap: wrap; gap: 0.6rem 1.6rem;
      justify-content: center; margin-bottom: 3rem;
      color: #8899aa; font-size: clamp(0.7rem, 1.6vw, 0.92rem);
    }
    .controls .kv { display: flex; align-items: center; gap: 0.4rem; }
    .controls kbd {
      background: #1a2233; border: 1px solid #334; border-radius: 4px;
      padding: 2px 8px; color: #cce; font-family: inherit; font-size: 0.88em;
    }
    #play-btn {
      padding: 14px 64px; font-size: clamp(1rem, 3vw, 1.35rem);
      font-weight: 800; letter-spacing: 0.1em;
      background: linear-gradient(135deg, #d42020, #ff4040);
      color: #fff; border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 0 40px #d4202080, 0 4px 16px #0008;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    #play-btn:hover  { transform: scale(1.06); box-shadow: 0 0 70px #ff4040aa, 0 4px 24px #0008; }
    #play-btn:active { transform: scale(0.96); }

    /* ── Portrait: rotate prompt ────────────────────────────────────────────── */
    #rotate-msg {
      display: none;
      position: fixed; inset: 0; z-index: 50;
      background: #07080f;
      flex-direction: column; align-items: center; justify-content: center;
      color: #fff; gap: 1.2rem;
    }
    #rotate-msg .icon { font-size: 4rem; animation: spin 2s linear infinite; }
    #rotate-msg p { font-size: 1.1rem; color: #6af; letter-spacing: 0.1em; }
    @keyframes spin {
      0%   { transform: rotate(0deg);   }
      40%  { transform: rotate(0deg);   }
      60%  { transform: rotate(90deg);  }
      100% { transform: rotate(90deg);  }
    }
    @media (orientation: portrait) {
      #rotate-msg { display: flex !important; }
    }

    /* ── Touch HUD (landscape mobile only) ─────────────────────────────────── */
    #touch-hud {
      display: none;
      position: fixed; inset: 0; z-index: 10;
      pointer-events: none;
    }

    /* Generic button style */
    .tbtn {
      position: absolute;
      display: flex; align-items: center; justify-content: center;
      border-radius: 50%;
      pointer-events: all;
      touch-action: none;
      user-select: none; -webkit-user-select: none;
      border: 2.5px solid rgba(255,255,255,0.22);
      background: rgba(255,255,255,0.10);
      color: rgba(255,255,255,0.75);
      transition: background 0.08s, transform 0.06s;
      font-size: 1.5rem;
    }
    .tbtn:active, .tbtn.pressed {
      background: rgba(255,255,255,0.28);
      transform: scale(0.93);
    }

    /* ── LEFT cluster — direction ───────────────────────────────────────────── */
    /* Two large circles side-by-side in bottom-left */
    #ctrl-left  {
      width: 80px; height: 80px;
      left: 24px; bottom: 28px;
    }
    #ctrl-right {
      width: 80px; height: 80px;
      left: 116px; bottom: 28px;
    }

    /* ── RIGHT cluster — throttle ───────────────────────────────────────────── */
    /* Big GAS at bottom-right, REVERSE above-left of it */
    #ctrl-gas {
      width: 90px; height: 90px;
      right: 24px; bottom: 24px;
      background: rgba(50,200,80,0.18);
      border-color: rgba(50,220,80,0.45);
      font-size: 1.8rem;
    }
    #ctrl-back {
      width: 70px; height: 70px;
      right: 124px; bottom: 39px;
      background: rgba(200,140,20,0.18);
      border-color: rgba(220,160,20,0.40);
    }

    /* ── Utility row — top of right cluster ─────────────────────────────────── */
    #ctrl-brake {
      width: 54px; height: 54px;
      right: 24px; bottom: 128px;
      background: rgba(200,50,50,0.18);
      border-color: rgba(220,50,50,0.40);
      font-size: 1.1rem;
    }
    #ctrl-reset {
      width: 54px; height: 54px;
      right: 90px; bottom: 128px;
      font-size: 1.0rem;
      border-radius: 14px;
    }
  </style>
</head>
<body>

  <!-- Portrait rotate prompt (always present, shown via CSS media query) -->
  <div id="rotate-msg">
    <div class="icon">&#8635;</div>
    <p>Rotate to landscape to play</p>
  </div>

  <!-- Splash overlay -->
  <div id="overlay">
    <h1>SEEDROAD</h1>
    <div class="sub">open-world driving</div>
    <div class="controls">
      <div class="kv"><kbd>W</kbd><kbd>↑</kbd> Accelerate</div>
      <div class="kv"><kbd>S</kbd><kbd>↓</kbd> Reverse</div>
      <div class="kv"><kbd>A</kbd><kbd>←</kbd> Steer left</div>
      <div class="kv"><kbd>D</kbd><kbd>→</kbd> Steer right</div>
      <div class="kv"><kbd>Space</kbd> Brake</div>
      <div class="kv"><kbd>R</kbd> Reset car</div>
    </div>
    <button id="play-btn">▶ &thinsp;PLAY</button>
  </div>

  <!-- Touch HUD (shown only on touch devices after PLAY) -->
  <div id="touch-hud">
    <!-- LEFT: steering -->
    <div class="tbtn" id="ctrl-left">&#9664;</div>
    <div class="tbtn" id="ctrl-right">&#9654;</div>
    <!-- RIGHT: throttle -->
    <div class="tbtn" id="ctrl-gas">&#9650;</div>
    <div class="tbtn" id="ctrl-back">&#9660;</div>
    <!-- UTILITY: brake + reset -->
    <div class="tbtn" id="ctrl-brake">&#9632;</div>
    <div class="tbtn" id="ctrl-reset">R</div>
  </div>

  <!-- Trunk replaces this with the compiled WASM loader -->
  <link data-trunk rel="rust" data-target-name="seedroad" data-wasm-opt="z" />

  <script>
    document.getElementById('play-btn').addEventListener('click', function () {
      document.getElementById('overlay').style.display = 'none';

      // Show touch HUD only on touch-capable devices
      if (navigator.maxTouchPoints > 0 || 'ontouchstart' in window) {
        document.getElementById('touch-hud').style.display = 'block';
      }

      // Request landscape lock if the API is available
      var scr = window.screen;
      if (scr.orientation && scr.orientation.lock) {
        scr.orientation.lock('landscape').catch(function(){});
      }

      // Fullscreen
      var el = document.querySelector('canvas') || document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
      if (req) req.call(el).catch(function(){});

      window.dispatchEvent(new Event('resize'));
    });
  </script>
</body>
</html>
