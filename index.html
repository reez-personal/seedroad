<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no, maximum-scale=1.0" />
  <title>Seedroad</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #07080f; overflow: hidden; font-family: system-ui, -apple-system, sans-serif; touch-action: none; }
    canvas { display: block; width: 100vw; height: 100vh; touch-action: none; }

    #overlay {
      position: fixed; inset: 0; z-index: 20;
      display: flex; flex-direction: column;
      align-items: center; justify-content: center;
      background: radial-gradient(ellipse at 50% 60%, #0d1a2e 0%, #07080f 70%);
    }
    #overlay h1 {
      font-size: clamp(2.5rem, 8vw, 5rem);
      font-weight: 900; letter-spacing: 0.12em; color: #fff;
      text-shadow: 0 0 60px #3af, 0 2px 4px #000;
      margin-bottom: 0.15em;
    }
    #overlay .sub {
      font-size: clamp(0.75rem, 2vw, 1rem); color: #6af;
      letter-spacing: 0.25em; text-transform: uppercase;
      margin-bottom: 2.5rem;
    }
    .controls {
      display: flex; flex-wrap: wrap; gap: 0.6rem 1.6rem;
      justify-content: center; margin-bottom: 3rem;
      color: #8899aa; font-size: clamp(0.7rem, 1.6vw, 0.92rem);
    }
    .controls .kv { display: flex; align-items: center; gap: 0.4rem; }
    .controls kbd {
      background: #1a2233; border: 1px solid #334; border-radius: 4px;
      padding: 2px 8px; color: #cce; font-family: inherit; font-size: 0.88em;
    }
    #play-btn {
      padding: 14px 64px; font-size: clamp(1rem, 3vw, 1.35rem);
      font-weight: 800; letter-spacing: 0.1em;
      background: linear-gradient(135deg, #d42020, #ff4040);
      color: #fff; border: none; border-radius: 8px; cursor: pointer;
      box-shadow: 0 0 40px #d4202080, 0 4px 16px #0008;
      transition: transform 0.12s, box-shadow 0.12s;
    }
    #play-btn:hover { transform: scale(1.06); box-shadow: 0 0 70px #ff4040aa, 0 4px 24px #0008; }
    #play-btn:active { transform: scale(0.96); }

    /* ── Mobile touch HUD ───────────────────────────────────────────────────── */
    #touch-hud {
      display: none;
      position: fixed; inset: 0; z-index: 10;
      pointer-events: none; /* pass-through except on buttons */
    }
    .touch-btn {
      position: absolute;
      background: rgba(255,255,255,0.12);
      border: 2px solid rgba(255,255,255,0.25);
      border-radius: 50%;
      color: rgba(255,255,255,0.70);
      font-size: 1.6rem;
      display: flex; align-items: center; justify-content: center;
      pointer-events: all;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
      transition: background 0.08s;
    }
    .touch-btn:active, .touch-btn.pressed {
      background: rgba(255,255,255,0.30);
    }

    /* Steering: bottom-left cluster */
    #ctrl-left  { width: 72px; height: 72px; left: 24px;  bottom: 28px; }
    #ctrl-right { width: 72px; height: 72px; left: 112px; bottom: 28px; }

    /* Gas / brake: bottom-right */
    #ctrl-gas   { width: 88px; height: 88px; right: 24px;  bottom: 28px; background: rgba(80,200,80,0.18); border-color: rgba(80,200,80,0.4); }
    #ctrl-brake { width: 64px; height: 64px; right: 124px; bottom: 44px; background: rgba(200,60,60,0.18); border-color: rgba(200,60,60,0.4); }

    /* Reset: top-right corner */
    #ctrl-reset { width: 52px; height: 52px; right: 20px; top: 20px; font-size: 1.1rem; border-radius: 12px; }
  </style>
</head>
<body>
  <!-- Overlay shown until the user clicks PLAY -->
  <div id="overlay">
    <h1>SEEDROAD</h1>
    <div class="sub">open-world driving</div>
    <div class="controls">
      <div class="kv"><kbd>W</kbd><kbd>↑</kbd> Accelerate</div>
      <div class="kv"><kbd>S</kbd><kbd>↓</kbd> Reverse</div>
      <div class="kv"><kbd>A</kbd><kbd>←</kbd> Steer left</div>
      <div class="kv"><kbd>D</kbd><kbd>→</kbd> Steer right</div>
      <div class="kv"><kbd>Space</kbd> Brake</div>
      <div class="kv"><kbd>R</kbd> Reset car</div>
    </div>
    <button id="play-btn">▶ &thinsp;PLAY</button>
  </div>

  <!-- Touch controls (visible on mobile after PLAY) -->
  <div id="touch-hud">
    <div class="touch-btn" id="ctrl-left">◀</div>
    <div class="touch-btn" id="ctrl-right">▶</div>
    <div class="touch-btn" id="ctrl-gas">▲</div>
    <div class="touch-btn" id="ctrl-brake">■</div>
    <div class="touch-btn" id="ctrl-reset">R</div>
  </div>

  <!-- Trunk replaces this with the compiled WASM loader -->
  <link data-trunk rel="rust" data-target-name="seedroad" data-wasm-opt="z" />

  <script>
    document.getElementById('play-btn').addEventListener('click', function () {
      document.getElementById('overlay').style.display = 'none';

      // Show touch HUD only on touch-capable devices
      if (navigator.maxTouchPoints > 0 || 'ontouchstart' in window) {
        document.getElementById('touch-hud').style.display = 'block';
      }

      // Attempt fullscreen on the canvas element
      var el = document.querySelector('canvas') || document.documentElement;
      var req = el.requestFullscreen || el.webkitRequestFullscreen || el.mozRequestFullScreen;
      if (req) req.call(el).catch(function(){});
      // Synthetic resize so winit re-measures the canvas after fullscreen
      window.dispatchEvent(new Event('resize'));
    });
  </script>
</body>
</html>
